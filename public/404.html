<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ARTIFURA</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License - https://github.com/rafgraph/spa-github-pages
    // This script converts the pathname and search to a query string on the root,
    // which index.html restores via history.replaceState.
    
    // Automatically detect repo subpath on github.io:
    // If hosted at <username>.github.io/<repo-name>, pathSegmentsToKeep is 1.
    // If hosted at a custom domain or user root (<username>.github.io), pathSegmentsToKeep is 0.
    var l = window.location;
    var isGitHubSubpath = l.hostname.endsWith('github.io') && l.pathname.split('/').filter(Boolean).length > 0;
    var pathSegmentsToKeep = isGitHubSubpath ? 1 : 0;

    l.replace(
      l.protocol + '//' + l.host +
      (l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/')) + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
